name: Clipboard History Verification

# Verification / packaging levels:
#   1. logic      - pure C++/Python checks, no toolchain needed (seconds)
#   2. smoke      - real C++ compile + link against an official Qt desktop kit
#                   on a stock GitHub-hosted Windows runner (minutes)
#   3. portable   - distributable Win+V clipboard-history build: the same
#                   controller/store translation units used by snow_shot,
#                   deployed with windeployqt and shipped as a zip plus an
#                   optional NSIS setup.exe. Runs on a hosted runner.
#   4. package    - full snow_shot installer; requires a self-hosted runner
#                   preloaded with VS 18 2026, the custom static Qt 6.12 kit
#                   and the pinned vcpkg baseline. Disabled by default.
#
# Why level 3 exists: the full snow_shot build hard-requires MSVC >= 14.51
# (VS 18 2026), CMake >= 4.2, an audited *static* Qt 6.12.0 kit and a full
# vcpkg source build (opencv4[contrib,dnn], ffmpeg 9.0, ...). None of that is
# available on GitHub-hosted runners, and a single job would exceed the 6h
# limit. Level 3 ships the actual feature as a runnable, portable program.
on:
  # Pushing to main is intentionally NOT a trigger: the verifier dispatches
  # this workflow explicitly so the run is unambiguous and inputs are set.
  push:
    branches:
      - 'clipboard-history/**'
    paths:
      - 'snow_shot/include/snow_shot/presentation/clipboardhistory*.h'
      - 'snow_shot/src/presentation/services/clipboardhistory*.cpp'
      - 'snow_shot/src/app/applicationcontroller.cpp'
      - 'snow_shot/CMakeLists.txt'
      - 'snow_shot/i18n/**'
      - 'snow_shot/tests/clipboard_history_guard_tests.cpp'
      - 'snow_shot/tests/clipboard_history_smoke/**'
      - 'snow_shot/tests/clipboard_history_app/**'
      - 'scripts/verify-clipboard-history.py'
      - 'scripts/verify-win-v-hotkey.py'
      - '.github/workflows/clipboard-history-verify.yml'
  workflow_dispatch:
    inputs:
      qt_version:
        description: Qt version for the compile smoke test (6.8.3 is the safe fallback)
        default: '6.12.0'
        type: string
      full_package:
        description: Also build the full installer (needs a prepared self-hosted runner)
        default: false
        type: boolean
      runner_label:
        description: Self-hosted runner label used by the full_package job
        default: 'windows-2025-vs2026'
        type: string

permissions:
  contents: read

concurrency:
  group: clipboard-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    name: Logic, wiring, catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile and run the C++ guard state machine (standard library only)
        run: |
          g++ -std=c++17 -Wall -Wextra \
            -I snow_shot/include \
            -o "${RUNNER_TEMP}/clipboard_history_guard_tests" \
            snow_shot/tests/clipboard_history_guard_tests.cpp
          "${RUNNER_TEMP}/clipboard_history_guard_tests"

      - name: Integration static + behavioural checks
        run: python scripts/verify-clipboard-history.py

      - name: Translation catalog check
        run: python snow_shot/scripts/translation_catalogs.py check --catalog-dir snow_shot/i18n

      - name: Translation catalog merge (Full and Mini, as CMake does)
        run: |
          python snow_shot/scripts/translation_catalogs.py merge \
            --catalog-dir snow_shot/i18n --output-dir "${RUNNER_TEMP}/i18n-full"
          python snow_shot/scripts/translation_catalogs.py merge \
            --catalog-dir snow_shot/i18n --output-dir "${RUNNER_TEMP}/i18n-mini" \
            --exclude-module translation --exclude-context SnowShotApiClient

  smoke:
    name: Real C++ compile + link (Qt on Windows)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # install-qt-action sets up its own Python >=3.14 (aqtinstall needs it).

      # aqtinstall 3.3.0 cannot parse the Qt 6.11+ Windows repository layout.
      # This patched aqtinstall is the known-good way to fetch Qt 6.12.0.
      - name: Install Qt (project version)
        id: qt_primary
        continue-on-error: true
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ inputs.qt_version || '6.12.0' }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: ${{ runner.workspace }}/qt-primary
          cache: true
          aqtsource: git+https://github.com/jdpurcell/aqtinstall.git@6f0f842da47c744cdc814cd94da9828d934d7bf0

      # If 6.12 cannot be fetched (mirror/patch drift), fall back to a Qt the
      # action supports out of the box. The new module uses only long-stable
      # Core/Gui/Widgets APIs, so this still catches compile and link errors.
      - name: Install Qt (safe fallback)
        if: steps.qt_primary.outcome == 'failure'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: ${{ runner.workspace }}/qt-fallback
          cache: true

      - name: Record the Qt root actually used
        shell: pwsh
        run: |
          "QT_SMOKE_ROOT=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Qt root: $env:QT_ROOT_DIR"

      - name: Configure standalone smoke project
        shell: pwsh
        run: |
          cmake -S snow_shot/tests/clipboard_history_smoke `
                -B build/clipboard-smoke `
                -G "Visual Studio 17 2022" -A x64 `
                "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }

      - name: Build every new translation unit
        shell: pwsh
        run: |
          cmake --build build/clipboard-smoke --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'C++ compile/link failed.' }

      - name: Run the guard unit test
        shell: pwsh
        run: |
          ctest --test-dir build/clipboard-smoke -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Guard unit test failed.' }

      - name: Win+V hook probe (informational; CI session may be non-interactive)
        continue-on-error: true
        shell: pwsh
        run: python scripts/verify-win-v-hotkey.py --selftest --simulate-winv

      - name: Upload compiled smoke binaries and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-history-smoke-${{ github.sha }}
          path: |
            build/clipboard-smoke/**/clipboard_history_guard_tests.exe
            build/clipboard-smoke/**/clipboard_history_smoke.exe
            build/clipboard-smoke/**/snow_shot_clipboard_history.lib
            build/clipboard-smoke/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  portable:
    name: Portable Win+V clipboard history package
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # install-qt-action installs its own Python >= 3.14 for aqtinstall.
      - name: Install Qt 6.12.0 (official dynamic kit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: ${{ runner.workspace }}/qt-portable
          cache: true
          aqtsource: git+https://github.com/jdpurcell/aqtinstall.git@6f0f842da47c744cdc814cd94da9828d934d7bf0

      - name: Build the standalone tray application
        shell: pwsh
        run: |
          cmake -S snow_shot/tests/clipboard_history_app `
                -B build/clipboard-app `
                -G "Visual Studio 17 2022" -A x64 `
                "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }
          cmake --build build/clipboard-app --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'C++ compile/link failed.' }

      - name: Deploy Qt runtime and build the portable zip
        shell: pwsh
        run: |
          $dist = "dist\snow-shot-clipboard-history-win64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "build\clipboard-app\Release\snow_shot_clipboard_history.exe" -Destination $dist
          Copy-Item "LICENSE.md" -Destination $dist

          # App-local VC++ 2022 CRT (Microsoft's documented local deployment
          # layout), so the portable build also runs on machines that never
          # installed the redistributable. Non-fatal if the runner layout differs.
          $vsRoot = "${env:ProgramFiles}\Microsoft Visual Studio\2022"
          $crt = Get-ChildItem -Path $vsRoot -Directory -ErrorAction SilentlyContinue |
              ForEach-Object {
                  Get-ChildItem -Path "$($_.FullName)\VC\Redist\MSVC" -Directory `
                      -ErrorAction SilentlyContinue
              } | Sort-Object Name -Descending | Select-Object -First 1
          if ($crt) {
              $crtBin = "$($crt.FullName)\x64\Microsoft.VC143.CRT"
              if (Test-Path $crtBin) {
                  Copy-Item "$crtBin\*.dll" -Destination $dist
                  Write-Host "Bundled VC++ CRT from $crtBin"
              }
          }
          if (-not (Test-Path "$dist\vcruntime140.dll")) {
              $systemRoot = Join-Path $env:WINDIR "System32"
              $copied = 0
              foreach ($name in @("vcruntime140.dll", "vcruntime140_1.dll",
                                  "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll")) {
                  $source = Join-Path $systemRoot $name
                  if (Test-Path $source) {
                      Copy-Item $source -Destination $dist
                      $copied += 1
                  }
              }
              Write-Host "Bundled $copied VC++ CRT DLL(s) from $systemRoot"
          }
          if (-not (Test-Path "$dist\vcruntime140.dll")) {
              Write-Host "VC++ CRT not bundled; README documents the redistributable requirement."
          }

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
              --release --no-translations --no-system-d3d-compiler --no-opengl-sw `
              "$dist\snow_shot_clipboard_history.exe"
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed.' }

          $readme = @"
          Snow Shot 剪贴板历史（Win+V 便携版）
          =====================================

          运行：双击 snow_shot_clipboard_history.exe，程序常驻系统托盘。
          唤起：Win+V（默认接管）或 Ctrl+Shift+V（兜底）。
          选择：在历史窗口里双击条目，或选中后按 Enter，即回贴到当前焦点窗口。
          设置：托盘右键可开关「接管 Win+V」；历史窗口内可调整保留条数（默认 200，上限 1000）。
          数据：历史保存在 %APPDATA%\snow-apps\SnowShotClipboardHistory\clipboard_history\。
          退出：托盘右键 -> 退出。关闭历史窗口不会退出程序。

          运行依赖
          --------
          需要 Microsoft Visual C++ 2022 Redistributable (x64)。本包已尽量附带运行库 DLL；
          若启动仍提示缺少 VCRUNTIME140.dll / MSVCP140.dll，请安装：
          https://aka.ms/vs/17/release/vc_redist.x64.exe
          NSIS 安装包 setup.exe 未做代码签名，Windows SmartScreen 可能拦截，选择「仍要运行」即可。

          说明
          ----
          本包只包含剪贴板历史功能，使用与 snow_shot 集成版相同的控制器/存储源码，
          不依赖完整 snow_shot 的静态 Qt、vcpkg、Rust 与 OCR 工具链。
          关闭「接管 Win+V」后，Win+V 会恢复为 Windows 自带剪贴板面板。

          许可证：GPL-3.0-or-later，详见 LICENSE.md。
          源码：https://github.com/lshaqh/snow-apps
          "@
          Set-Content -Path "$dist\README.txt" -Value $readme -Encoding utf8

          Compress-Archive -Path "$dist\*" `
              -DestinationPath "snow-shot-clipboard-history-win64.zip" -Force
          $hash = (Get-FileHash "snow-shot-clipboard-history-win64.zip" -Algorithm SHA256).Hash
          Set-Content -Path "snow-shot-clipboard-history-win64.zip.sha256" `
              -Value "$hash  snow-shot-clipboard-history-win64.zip" -Encoding utf8
          Write-Host "Portable zip: $((Get-Item 'snow-shot-clipboard-history-win64.zip').Length) bytes  sha256=$hash"

      - name: Build an NSIS setup.exe (optional, does not fail the job)
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --yes --no-progress
          }
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw 'makensis.exe not found' }
          & $makensis `
              "/DOUTFILE=$((Get-Location).Path)\snow-shot-clipboard-history-setup.exe" `
              "/DDISTDIR=$((Get-Location).Path)\dist\snow-shot-clipboard-history-win64" `
              "snow_shot\tests\clipboard_history_app\installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw 'NSIS build failed.' }
          Write-Host "Setup.exe: $((Get-Item 'snow-shot-clipboard-history-setup.exe').Length) bytes"

      - name: Upload portable zip and installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snow-shot-clipboard-history-${{ github.sha }}
          path: |
            snow-shot-clipboard-history-win64.zip
            snow-shot-clipboard-history-win64.zip.sha256
            snow-shot-clipboard-history-setup.exe
          if-no-files-found: warn
          retention-days: 30

  # Requires a runner that already has VS 18 2026, the custom static Qt 6.12
  # kit (SNOW_QT_STATIC_DIR) and the pinned vcpkg checkout. Stock GitHub
  # runners cannot satisfy these prerequisites, so this job is opt-in.
  package:
    name: Full installer package (self-hosted only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_package }}
    runs-on: ${{ inputs.runner_label || 'windows-2025-vs2026' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap pinned toolchain
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -Preset snow-shot-msvc-fast -Architecture x64

      - name: Build snow_shot
        shell: pwsh
        run: ./scripts/build.ps1 -Preset snow-shot-msvc-fast -Target snow_shot

      - name: Package standalone installer
        shell: pwsh
        run: ./scripts/package-snow-shot.ps1 -Architecture x64 -SkipBuild

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snow-shot-installer-${{ github.sha }}
          path: |
            artifacts/**/*.exe
            artifacts/**/*.msix
            artifacts/**/*.zip
          if-no-files-found: warn
